<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiln</title>
<style>
:root{--bg:#161513;--panel:#211f1c;--panel2:#292622;--ink:#f4eee4;--muted:#aaa196;--line:#3a3530;--orange:#e37735;--green:#76be86;--danger:#df6a55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.sidebar{padding:24px 14px;border-right:1px solid var(--line);background:#1b1916}.brand{display:flex;gap:10px;align-items:center;padding:0 10px 28px;font-size:20px;font-weight:700;letter-spacing:.3px}.mark{width:27px;height:31px;background:var(--orange);clip-path:polygon(50% 0,91% 24%,82% 82%,50% 100%,18% 82%,9% 24%);box-shadow:0 0 26px #e3773560}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:8px;text-align:left;font:inherit;cursor:pointer}.nav button:hover,.nav button.active{color:var(--ink);background:var(--panel2)}.nav button.active{box-shadow:inset 3px 0 var(--orange)}.status{position:fixed;bottom:22px;left:24px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:7px}.workspace{display:grid;grid-template-rows:auto 1fr;min-width:0}.topbar{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.title{font-size:17px;font-weight:650}.chips{display:flex;gap:8px;align-items:center}.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--muted)}.chip.orange{color:#f3b68d;border-color:#8b4c2b}.view{display:none;min-height:0}.view.active{display:block}.chat{height:calc(100vh - 74px);display:grid;grid-template-columns:minmax(0,1fr) 294px}.thread{overflow:auto;padding:36px max(7vw,36px) 130px}.message{max-width:820px;margin:0 auto 26px}.who{font-size:12px;color:var(--muted);margin-bottom:7px}.bubble{background:var(--panel);padding:15px 17px;border-radius:11px;white-space:pre-wrap}.user .bubble{background:#33281f;border:1px solid #5b3b26}.composer{position:fixed;bottom:26px;left:calc(224px + max(7vw,36px));right:calc(294px + max(3vw,24px));display:flex;gap:8px;background:var(--panel);padding:8px;border:1px solid var(--line);border-radius:12px}.composer textarea{resize:none;min-height:42px;max-height:180px;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:10px}.button{border:0;border-radius:8px;background:var(--orange);color:#20130c;font-weight:700;padding:9px 14px;cursor:pointer}.button:disabled{opacity:.45;cursor:wait}.inspector{border-left:1px solid var(--line);padding:24px 18px;background:#1b1916}.card{padding:15px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.card h3{font-size:13px;margin:0 0 13px}.row{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #35302b;color:var(--muted)}.row:first-of-type{border-top:0}.on{color:var(--green)}.main{max-width:980px;padding:38px max(7vw,36px)}.main h2{font-size:23px;margin:0 0 6px}.hint{color:var(--muted);margin:0 0 25px}.stack{display:grid;gap:12px}.input,textarea{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:11px;font:inherit}.result{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;white-space:pre-wrap;overflow:auto}.drop{border:1px dashed #6a5d50;border-radius:10px;padding:25px;text-align:center;color:var(--muted)}.files a{display:inline-block;color:#f4b38b;margin:5px 10px 0 0}.settings{max-width:780px}.section{margin:26px 0 15px;color:#f3b68d;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);padding:9px;font:inherit}.notice{display:none;padding:10px 12px;border-radius:8px;background:#273529;color:#b6e5be}.notice.show{display:block}.empty{color:var(--muted);text-align:center;padding:80px}.loading{opacity:.6}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.chat{grid-template-columns:1fr}.inspector{display:none}.composer{left:24px;right:24px}.main{padding:28px 24px}.topbar{padding:0 24px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app"><aside class="sidebar"><div class="brand"><i class="mark"></i>Kiln</div><nav class="nav"><button class="active" data-view="chat">◉　对话</button><button data-view="embed">⌘　向量</button><button data-view="ocr">▧　文档 OCR</button><button data-view="settings">⚙　设置</button></nav><div class="status"><span class="dot"></span>本地服务正常<br><span id="endpoint">127.0.0.1:8007</span></div></aside><main class="workspace"><header class="topbar"><div class="title" id="view-title">对话</div><div class="chips"><span class="chip" id="model-chip">加载中</span><span class="chip orange" id="mtp-chip">MTP</span></div></header>
<section class="view active" id="chat"><div class="chat"><div class="thread" id="thread"><div class="message"><div class="who">Kiln</div><div class="bubble">本地模型已就绪。可以对话、生成向量，或解析文档。</div></div></div><form class="composer" id="chat-form"><textarea id="chat-input" placeholder="问 Kiln 任何事…" required></textarea><button class="button">发送</button></form><aside class="inspector"><div class="card"><h3>运行状态</h3><div class="row"><span>Agent</span><span class="on" id="agent-state">检查中</span></div><div class="row"><span>Embedding</span><span>按需加载</span></div><div class="row"><span>OCR</span><span>按需加载</span></div></div><div class="card"><h3>提示</h3><div class="row"><span>模型切换会重建 worker，约 10–15 秒。</span></div></div></aside></div></section>
<section class="view" id="embed"><div class="main"><h2>向量</h2><p class="hint">用当前 Embedding 模型生成 JSON 向量。</p><form class="stack" id="embed-form"><textarea id="embed-input" rows="7" placeholder="输入要向量化的文本" required></textarea><div><button class="button">生成向量</button></div></form><pre class="result" id="embed-result">尚未生成。</pre></div></section>
<section class="view" id="ocr"><div class="main"><h2>文档 OCR</h2><p class="hint">上传 PDF 或图片，输出 Markdown、JSON、DOCX 与版面标注图。</p><form class="stack" id="ocr-form"><label class="drop">选择 PDF、PNG、JPG、WEBP、BMP 或 TIFF<input id="ocr-input" type="file" accept=".pdf,image/*" hidden required></label><div><button class="button">解析文档</button></div></form><div class="result" id="ocr-result">尚未上传。</div></div></section>
<section class="view" id="settings"><div class="main settings"><h2>设置</h2><p class="hint">修改后先保存，再应用并重启。密钥不在这里管理。</p><div class="notice" id="notice"></div><form id="settings-form"><div class="section">模型</div><div class="grid"><div class="field"><label>Agent 模型</label><input name="agent"></div><div class="field"><label>MTP Draft 模型，留空则关闭</label><input name="draft"></div><div class="field"><label>Embedding 模型</label><input name="embedding"></div><div class="field"><label>OCR VLM 模型</label><input name="ocr"></div></div><div class="section">运行参数</div><div class="grid"><div class="field"><label>Draft 类型</label><select name="draft_kind"><option value="mtp">mtp</option><option value="dflash">dflash</option><option value="eagle3">eagle3</option><option value="">关闭</option></select></div><div class="field"><label>Draft block size</label><input name="draft_block_size" type="number"></div><div class="field"><label>KV bits</label><input name="kv_bits" type="number"></div><div class="field"><label>最大 KV tokens</label><input name="max_kv_size" type="number"></div><div class="field"><label>最大输出 tokens</label><input name="max_tokens" type="number"></div><div class="field"><label>最大并发序列</label><input name="max_num_seqs" type="number"></div><div class="field"><label>进度日志间隔</label><input name="log_progress_interval" type="number"></div><div class="field"><label>Vision cache size</label><input name="vision_cache_size" type="number"></div><div class="field"><label>Prefill step size</label><input name="prefill_step_size" type="number"></div><div class="field"><label>量化 KV 起点</label><input name="quantized_kv_start" type="number"></div></div><div class="section">思考模式</div><label><input name="enable_thinking" type="checkbox"> 默认启用 thinking</label><div style="margin-top:22px"><button class="button" type="submit">保存设置</button> <button class="button" id="restart" type="button" disabled>应用并重启</button></div></form></div></section>
</main></div>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s); let settings;
async function api(path, options={}){const r=await fetch('/ui/api/'+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.json()}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function show(view){$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$$('.view').forEach(v=>v.classList.toggle('active',v.id===view));$('#view-title').textContent={chat:'对话',embed:'向量',ocr:'文档 OCR',settings:'设置'}[view]}
$$('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));
function addMessage(role,text){const m=document.createElement('div');m.className='message '+(role==='你'?'user':'');m.innerHTML=`<div class="who">${role}</div><div class="bubble">${esc(text)}</div>`;$('#thread').append(m);m.scrollIntoView({block:'end'})}
$('#chat-form').onsubmit=async e=>{e.preventDefault();const input=$('#chat-input'),button=e.target.querySelector('button'),text=input.value.trim();if(!text)return;addMessage('你',text);input.value='';button.disabled=true;try{const data=await api('chat',{method:'POST',body:JSON.stringify({model:settings.models.agent,messages:[{role:'user',content:text}],temperature:.6,stream:false})});addMessage('Kiln',data.choices?.[0]?.message?.content||'没有返回内容。')}catch(err){addMessage('Kiln','请求失败：'+err.message)}finally{button.disabled=false;input.focus()}};
$('#embed-form').onsubmit=async e=>{e.preventDefault();const out=$('#embed-result');out.textContent='生成中…';try{const data=await api('embeddings',{method:'POST',body:JSON.stringify({model:settings.models.embedding,input:$('#embed-input').value})});const v=data.data?.[0]?.embedding||[];out.textContent=`维度：${v.length}\n\n前 16 项：\n${JSON.stringify(v.slice(0,16),null,2)}\n\n完整向量已在原始 API 响应中可取得。`}catch(err){out.textContent='失败：'+err.message}};
$('#ocr-form').onsubmit=async e=>{e.preventDefault();const file=$('#ocr-input').files[0],out=$('#ocr-result'),button=e.target.querySelector('button');if(!file)return;button.disabled=true;out.textContent='解析中，首次加载 OCR 模型可能需要一点时间…';try{const fd=new FormData();fd.append('file',file);const r=await fetch('/ui/api/ocr',{method:'POST',body:fd});if(!r.ok)throw new Error(await r.text());const data=await r.json();out.innerHTML=`<strong>Markdown</strong><br><br>${esc(data.markdown||'未生成 Markdown')}<div class="files">${data.files.map(f=>`<a href="/ui/api/ocr/${data.task}/${encodeURIComponent(f)}">下载 ${esc(f)}</a>`).join('')}</div>`}catch(err){out.textContent='失败：'+err.message}finally{button.disabled=false}};
function fillSettings(s){settings=s;$('#model-chip').textContent=s.models.agent;$('#mtp-chip').textContent=s.models.draft?'MTP 已启用':'Draft 已关闭';$('#endpoint').textContent=`${s.server.host}:${s.server.port}`;for(const [k,v] of Object.entries(s.models))$(`[name="${k}"]`).value=v;for(const [k,v] of Object.entries(s.runtime)){const el=$(`[name="${k}"]`);if(!el)continue;if(el.type==='checkbox')el.checked=v;else el.value=v}}
$('#settings-form').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.target),models={},runtime={};for(const k of ['agent','draft','embedding','ocr'])models[k]=form.get(k).trim();for(const k of ['draft_kind','draft_block_size','kv_bits','max_kv_size','max_tokens','max_num_seqs','quantized_kv_start','prefill_step_size','vision_cache_size','log_progress_interval'])runtime[k]=k==='draft_kind'?form.get(k):Number(form.get(k));runtime.enable_thinking=form.get('enable_thinking')==='on';try{const result=await api('settings',{method:'PUT',body:JSON.stringify({models,runtime})});settings=result.settings;fillSettings(settings);$('#notice').textContent='已保存。点击“应用并重启”让 worker 读取新配置。';$('#notice').classList.add('show');$('#restart').disabled=false}catch(err){$('#notice').textContent='保存失败：'+err.message;$('#notice').classList.add('show')}};
$('#restart').onclick=async()=>{await api('restart',{method:'POST'});$('#notice').textContent='正在重启。页面会在服务恢复后自动刷新。';setTimeout(()=>location.reload(),6000)};
api('settings').then(s=>{fillSettings(s);return api('health')}).then(h=>{const loaded=h.loaded_models||{};const agent=loaded.text_generation?.model||'未加载';$('#agent-state').textContent=agent===settings.models.agent?'已加载':'当前：'+agent}).catch(err=>{document.body.innerHTML='<p class="empty">会话已失效。请在终端运行 <code>kiln ui</code> 重新打开。</p>'});
</script></body></html>
